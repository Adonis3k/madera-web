<!--
  Madera Web // MW logo mark
  Vector-traced from source PNG (368x121) at brand navy #272595.
  - Fixed lettering asset per brand-style-guide.md: never recolor into teal/green,
    never reset in Roboto Mono, never stretch/skew/add effects.
  - Reverse to white (#FFFFFF) on Ink Navy / dark surfaces.
  - Minimum width: 96px digital / 1in print. Clear space on all sides = height of the "M".
-->
